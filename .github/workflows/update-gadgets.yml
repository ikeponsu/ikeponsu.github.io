name: Update Latest Gadgets

on:
  schedule:
    # JST 9:00 / 12:00 / 18:00 (UTCではそれぞれ 0:00 / 3:00 / 9:00)
    - cron: "0 0,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "update-gadgets"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest gadgets from Amazon Creators API
        env:
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run fetch:gadgets

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/content/posts/latest-gadgets.md; then
            echo "No changes to commit."
          else
            git add src/content/posts/latest-gadgets.md
            git commit -m "chore: update latest gadgets"
            git push
          fi
